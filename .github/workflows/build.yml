name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Use JDK
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "21"
          cache: "gradle"

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Show APK manifest
        run: |
          AAPT2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$AAPT2" dump badging "$APK"
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK"
          "$AAPT2" dump xmltree --file res/xml/automotive_app_desc.xml "$APK" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: carmirror-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Rolling "latest" release so the newest main APK has a plain download link:
      # https://github.com/<owner>/<repo>/releases/download/latest/carmirror.apk
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk carmirror.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest carmirror.apk \
            --target "$GITHUB_SHA" \
            --title "Car Mirror (latest main)" \
            --notes "Built from ${GITHUB_SHA::7}. Debug-key signed APK."
